name: Laravel Test Suite

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - dev
      - update-dev

permissions:
  contents: read

jobs:
  direct-messages-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pixelfed_test
          POSTGRES_USER: pixelfed
          POSTGRES_PASSWORD: pixelfed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixelfed -d pixelfed_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:2rK9gO0V1xgJgQFfJYgMCdTWwFQ5WzD3U+shWOZy3WU=
      CACHE_DRIVER: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: pixelfed_test
      DB_USERNAME: pixelfed
      DB_PASSWORD: pixelfed
      FILESYSTEM_DISK: local
      QUEUE_DRIVER: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Test direct messages on PostgreSQL
        run: php artisan test tests/Feature/DirectMessageIntegrityTest.php

  tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      CACHE_DRIVER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      FILESYSTEM_DISK: local
      QUEUE_DRIVER: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install and audit PHP dependencies
        run: |
          composer validate --strict --check-lock
          composer install --no-interaction --prefer-dist

      - name: Prepare test application
        run: |
          cp .env.testing .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --force

      - name: Test application and bootstrap modes
        run: |
          php artisan test
          OAUTH_PAT_ENABLED=false php artisan about --only=environment
          OAUTH_PAT_ENABLED=true php artisan about --only=environment
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Install, audit and build frontend
        run: |
          npm ci
          npm run production

      - name: Verify generated assets and formatting
        run: |
          git diff --exit-code -- public
          git diff --check
