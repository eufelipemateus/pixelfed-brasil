name: Deploy

on:
    workflow_dispatch:
    push:
      branches:
        - main
        - dev

permissions:
  actions: write
  contents: write
  deployments: write

jobs:
  test:
    uses: ./.github/workflows/laravel.yml
    secrets: inherit



  release:
    needs: test
    name: Release Pixelfed Docker Image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'DEV' }}
    env:
      APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'DEV' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
            set-safe-directory: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install


      - name: Install Private GitHub Package
        run: |
          touch .env
          echo "CACHE_DRIVER=file" >> .env
          echo "SESSION_DRIVER=file" >> .env
          composer config --global github-oauth.github.com ${{ secrets.CUSTOM_TOKEN }}
          composer config repositories.pixelfed-lib vcs https://github.com/eufelipemateus/pixelfed-lib
          composer require felipemateus/pixelfed-lib:${{ vars.PIXELFED_LIB_VERSION }} --prefer-source
          rm .env

      - name: Generate complete production .env
        env:
          DEPLOY_APP_ENV: ${{ env.APP_ENV }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          HORIZON_MEMORY_LIMIT: ${{ vars.HORIZON_MEMORY_LIMIT }}
          HORIZON_MAX_PROCESSES: ${{ vars.HORIZON_MAX_PROCESSES }}
          CAPTCHA_SECRET: ${{ secrets.CAPTCHA_SECRET }}
          CAPTCHA_SITEKEY: ${{ secrets.CAPTCHA_SITEKEY }}
          BANNED_USERNAMES: ${{ secrets.BANNED_USERNAMES }}
          DANGEROUSLY_SET_FILESYSTEM_DRIVER: ${{ secrets.FILESYSTEM_CLOUD }}
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
          AWS_URL: ${{ secrets.DO_SPACES_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.S3_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          FELIPEMATEUS_SENDPORTAL_TOKEN: ${{ secrets.FELIPEMATEUS_SENDPORTAL_TOKEN }}
          TRANSLATION_PROVIDER: ${{ secrets.TRANSLATE_PROVIDER }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          PF_IMPORT_FROM_INSTAGRAM: ${{ vars.PF_IMPORT_FROM_INSTAGRAM }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          php .github/scripts/generate-production-env.php
          test "$(cut -d= -f1 .env | sort | uniq -d | wc -l)" -eq 0
          grep -q '^MAIL_DRIVER="smtp"$' .env
          grep -q '^MAIL_PORT="587"$' .env
          grep -q '^PF_ENABLE_CLOUD="true"$' .env

      - name: Encrypt .env
        run: php artisan env:encrypt --key="${{secrets.ENV_KEY}}"

      - name: Remove .git
        run: rm -rf .git

      - name: Write SSH keys
        run: |
            install -m 600 -D /dev/null ~/.ssh/id_rsa
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            ssh-keyscan -H ${{secrets.SSH_HOST}} > ~/.ssh/known_hosts


     # - name: Down  App
     #  uses: appleboy/ssh-action@v1.0.0
     #   with:
     #     host: ${{ secrets.SSH_HOST }}
     #     username: ${{ secrets.SSH_USER }}
     #     key: ${{ secrets.SSH_PRIVATE_KEY }}
     #     script: |
     #       cd ${{secrets.WORK_DIR}}
     #       php artisan down

      - name: 📂 Deploy with rsync
        run: rsync -rav --delete ./  ${{secrets.SSH_USER}}@${{secrets.SSH_HOST}}:/tmp/pixelfed   #${{secrets.WORK_DIR}}

      - name: Restart Apps
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            WORK_DIR='${{ secrets.WORK_DIR }}'
            sudo cp -aT /tmp/pixelfed "$WORK_DIR"
            sudo chown -R www-data:www-data "$WORK_DIR"
            sudo find "$WORK_DIR" -type d -exec chmod 755 {} +
            sudo find "$WORK_DIR" -type f -exec chmod 644 {} +
            sudo find "$WORK_DIR/storage" "$WORK_DIR/bootstrap/cache" -type d -exec chmod 750 {} +
            sudo find "$WORK_DIR/storage" "$WORK_DIR/bootstrap/cache" -type f -exec chmod 640 {} +
            if [ -f "$WORK_DIR/storage/oauth-private.key" ]; then
              sudo chown www-data:www-data "$WORK_DIR/storage/oauth-private.key"
              sudo chmod 600 "$WORK_DIR/storage/oauth-private.key"
            fi
            if [ -f "$WORK_DIR/storage/oauth-public.key" ]; then
              sudo chown www-data:www-data "$WORK_DIR/storage/oauth-public.key"
              sudo chmod 644 "$WORK_DIR/storage/oauth-public.key"
            fi
            cd "$WORK_DIR"
            php artisan migrate --force
            php artisan storage:link
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
            php artisan up
