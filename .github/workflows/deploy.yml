name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/laravel.yml

  release:
    needs: test
    name: Build, test and deploy immutable artifact
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'DEV' }}
    env:
      APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'DEV' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Build public dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run production

      # This package remains private for licensing reasons and is intentionally
      # installed only in the deployment artifact.
      - name: Install licensed package into artifact
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.CUSTOM_TOKEN }}"}}'
        run: |
          composer config repositories.pixelfed-lib vcs https://github.com/eufelipemateus/pixelfed-lib
          composer require "felipemateus/pixelfed-lib:dev-${{ vars.PIXELFED_LIB_VERSION }}" --prefer-source --no-interaction

      - name: Test final artifact
        run: |
          cp .env.testing .env
          php artisan key:generate
          php artisan test
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          rm .env

      - name: Configure verified SSH host identity
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_rsa
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "${{ secrets.SSH_HOST }}" -f ~/.ssh/known_hosts

      - name: Deploy tested artifact
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/pixelfed/"
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sudo cp -aT /tmp/pixelfed '${{ secrets.WORK_DIR }}' &&
             sudo chown -R www-data:www-data '${{ secrets.WORK_DIR }}' &&
             sudo find '${{ secrets.WORK_DIR }}' -type d -exec chmod 755 {} + &&
             sudo find '${{ secrets.WORK_DIR }}' -type f -exec chmod 644 {} + &&
             sudo chmod 750 '${{ secrets.WORK_DIR }}/storage' '${{ secrets.WORK_DIR }}/bootstrap/cache' &&
             sudo find '${{ secrets.WORK_DIR }}/storage' '${{ secrets.WORK_DIR }}/bootstrap/cache' -type d -exec chmod 750 {} + &&
             sudo find '${{ secrets.WORK_DIR }}/storage' '${{ secrets.WORK_DIR }}/bootstrap/cache' -type f -exec chmod 640 {} + &&
             sudo test ! -f '${{ secrets.WORK_DIR }}/.env' || sudo chmod 640 '${{ secrets.WORK_DIR }}/.env' &&
             sudo test ! -f '${{ secrets.WORK_DIR }}/storage/oauth-private.key' || sudo chmod 600 '${{ secrets.WORK_DIR }}/storage/oauth-private.key' &&
             sudo test ! -f '${{ secrets.WORK_DIR }}/storage/oauth-public.key' || sudo chmod 600 '${{ secrets.WORK_DIR }}/storage/oauth-public.key' &&
             cd '${{ secrets.WORK_DIR }}' &&
             php artisan migrate --force &&
             php artisan storage:link &&
             php artisan optimize"
